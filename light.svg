<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="1180" height="610">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF6FF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <filter id="glassLight">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1180" height="610" fill="url(#bgGradient)" rx="24" />
  
  <pattern id="gridLight" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0F172A" stroke-opacity="0.04" stroke-width="1" />
  </pattern>
  <rect width="1180" height="610" fill="url(#gridLight)" rx="24" />

  <!-- LEFT PANEL -->
  <g transform="translate(40, 40)">
    <rect width="400" height="530" fill="#FFFFFF" fill-opacity="0.6" stroke="#CBD5E1" stroke-opacity="0.5" rx="16" filter="url(#glassLight)" />
    
    <circle cx="30" cy="30" r="6" fill="#EF4444" />
    <circle cx="50" cy="30" r="6" fill="#F59E0B" />
    <circle cx="70" cy="30" r="6" fill="#10B981" />
    <text x="95" y="34" fill="#475569" font-family="monospace" font-size="12">ruan@dev:~ [ ONLINE ]</text>

    <!-- ASCII Identity -->
    <g transform="translate(40, 100)" font-family="monospace" font-size="10" fill="#2563EB" font-weight="bold">
      <text x="0" y="0">      :::::::::  :::    :::     :::     ::::    ::: </text>
      <text x="0" y="15">     :+:    :+: :+:    :+:   :+: :+:   :+:+:   :+:  </text>
      <text x="0" y="30">    +:+    +:+ +:+    +:+  +:+   +:+  :+:+:+  +:+   </text>
      <text x="0" y="45">   +#++:++#:  +#+    +:+ +#++:++#++: +#+ +:+ +#+    </text>
      <text x="0" y="60">  +#+    +#+ +#+    +#+ +#+     +#+ +#+  +#+#+#     </text>
      <text x="0" y="75"> #+#    #+# #+#    #+# #+#     #+# #+#   #+#+#      </text>
      <text x="0" y="90">###    ###  ########  ###     ### ###    ####       </text>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="4s" repeatCount="indefinite" />
    </g>

    <text x="40" y="270" fill="#0F172A" font-family="sans-serif" font-size="24" font-weight="bold" letter-spacing="2">[ ENGINEERING ]</text>
    <text x="40" y="310" fill="#2563EB" font-family="sans-serif" font-size="18" font-weight="bold">Desenvolvedor Front-end</text>
    <text x="40" y="340" fill="#475569" font-family="sans-serif" font-size="14">Arquiteturas Escaláveis & MFEs</text>

    <text x="40" y="480" fill="#10B981" font-family="monospace" font-size="14">~/profile $ build --ship<tspan fill="#0F172A">_</tspan>
       <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite" />
    </text>
  </g>

  <!-- RIGHT PANEL -->
  <g transform="translate(480, 40)">
    <rect width="660" height="530" fill="#FFFFFF" fill-opacity="0.7" stroke="#CBD5E1" stroke-opacity="0.5" rx="16" filter="url(#glassLight)" />
    
    <text x="40" y="45" fill="#475569" font-family="monospace" font-size="12" letter-spacing="2">SYSTEM.INFO</text>
    <line x1="40" y1="65" x2="620" y2="65" stroke="#0F172A" stroke-opacity="0.1" />

    <text x="40" y="100" fill="#10B981" font-family="monospace" font-size="15">ruan@developer:~$ ./profile.sh</text>

    <g transform="translate(40, 150)" font-family="monospace" font-size="16">
      <text x="0" y="0" fill="#2563EB">> NAME</text>
      <text x="140" y="0" fill="#0F172A" font-weight="bold">Ruan C. Rodrigues</text>
      <text x="0" y="40" fill="#2563EB">> ROLE</text>
      <text x="140" y="40" fill="#0F172A">Engenheiro de Software Front-end</text>
      <text x="0" y="80" fill="#2563EB">> PREV</text>
      <text x="140" y="80" fill="#475569">Itaú Unibanco (2023 - 2026)</text>
      <text x="0" y="120" fill="#2563EB">> LOCATION</text>
      <text x="140" y="120" fill="#475569">São Paulo, SP, Brasil</text>
      <text x="0" y="160" fill="#2563EB">> EXPERIENCE</text>
      <text x="140" y="160" fill="#0F172A">3+ Anos</text>
      <text x="0" y="200" fill="#2563EB">> FOCUS</text>
      <text x="140" y="200" fill="#06B6D4">Micro Frontends, Arquitetura UI, SSR, APIs</text>
      <text x="0" y="240" fill="#2563EB">> STACK</text>
      <text x="140" y="240" fill="#0F172A">React, Next.js, Angular, TypeScript, Jest</text>
      <text x="0" y="280" fill="#2563EB">> BUILDING</text>
      <text x="140" y="280" fill="#0F172A">Sistemas Financeiros Escaláveis & Automação</text>
    </g>

    <!-- Pills Grid -->
    <g transform="translate(40, 460)" font-family="sans-serif" font-size="12" font-weight="bold">
      <rect x="0" y="0" width="105" height="30" rx="15" fill="#2563EB" fill-opacity="0.15" stroke="#2563EB" stroke-opacity="0.4" />
      <text x="52" y="19" fill="#2563EB" text-anchor="middle">React/Next.js</text>
      
      <rect x="115" y="0" width="75" height="30" rx="15" fill="#06B6D4" fill-opacity="0.15" stroke="#06B6D4" stroke-opacity="0.4" />
      <text x="152" y="19" fill="#06B6D4" text-anchor="middle">Angular</text>
      
      <rect x="200" y="0" width="95" height="30" rx="15" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.4" />
      <text x="247" y="19" fill="#10B981" text-anchor="middle">TypeScript</text>
      
      <rect x="305" y="0" width="125" height="30" rx="15" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-opacity="0.4" />
      <text x="367" y="19" fill="#F59E0B" text-anchor="middle">Micro Frontends</text>
      
      <rect x="440" y="0" width="60" height="30" rx="15" fill="#EF4444" fill-opacity="0.15" stroke="#EF4444" stroke-opacity="0.4" />
      <text x="470" y="19" fill="#EF4444" text-anchor="middle">Jest</text>
    </g>
  </g>
</svg>
